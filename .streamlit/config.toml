[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[logger]
level = "info"

[server]
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true

[theme]
base = "light"
primaryColor = "#176B75"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#1E293B"
font = "sans serif"
baseFontSize = 16
