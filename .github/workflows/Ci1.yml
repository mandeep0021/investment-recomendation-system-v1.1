name: Python quality and security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Requirements1.txt
          python -m pip install -r Requirements-dev1.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Run automated tests
        run: python -m unittest discover -s tests -p 'Test*.py' -v
      - name: Audit installed dependencies
        run: pip-audit
      - name: Static security scan
        run: bandit -q -r Analysis1.py -ll
      - name: Build deployment container
        run: docker build --file Dockerfile1 --tag investment-recommendation-system:ci .
